[package]
name = "clamv-webui"
description = "Web UI for ClamAV clamd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clamd.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["set-header", "trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite-bundled", "postgres", "mysql", "migrate", "macros"] }
argon2 = { version = "0.5", features = ["std"] }
bcrypt = "0.17"
rand = "0.9"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
clap = { version = "4", features = ["derive", "env"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
