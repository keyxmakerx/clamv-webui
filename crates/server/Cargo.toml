[package]
name = "clamv-webui"
description = "Web UI for ClamAV clamd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clamd.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["set-header", "trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite-bundled", "postgres", "mysql", "migrate", "macros"] }
uuid = { version = "1", features = ["v7"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
