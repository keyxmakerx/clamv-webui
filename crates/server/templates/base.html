<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% block head %}{% endblock %}
<title>{% block title %}ClamAV Web UI{% endblock %}</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/bootstrap.min.css?v={{ crate::web::asset_v() }}">
<link rel="stylesheet" href="/css/all.css?v={{ crate::web::asset_v() }}">
<link rel="stylesheet" href="/css/style.css?v={{ crate::web::asset_v() }}">
<link rel="stylesheet" href="/css/phase0.css?v={{ crate::web::asset_v() }}">
<link rel="stylesheet" href="/css/ui.css?v={{ crate::web::asset_v() }}">
<script src="/js/theme.js?v={{ crate::web::asset_v() }}"></script>
<script defer src="/js/script.js?v={{ crate::web::asset_v() }}"></script>
</head>
<body{% block body_class %}{% endblock %}>
{% block body %}{% endblock %}
</body>
</html>
