# UI only: joins an existing network and uses a clamd it does not own.
services:
  clamv-webui:
    image: ghcr.io/keyxmakerx/clamv-webui:latest
    container_name: clamv-webui
    restart: unless-stopped
    environment:
      CLAMD_ENDPOINT: tcp://clamav:3310  # existing clamd container on the shared network
      # CLAMD_MAX_STREAM_MB: "1024"  # default; clamd StreamMaxLength must be at least this
      CLAMD_HOST_ALLOWLIST: clamav  # admins can only add endpoints on these hosts
      SCAN_ROOTS: /data,/documents,/games  # clamd must see these at the same paths
      LOG_FORMAT: json  # one JSON object per line for fluent-bit
      # TLS_SELF_SIGNED: "true"  # HTTPS for clamctl; certificate lands in ./data/tls
      # TLS_SELF_SIGNED_NAMES: 100.82.x.y  # the mesh IP or name clients connect to
      # WEBHOOK_URL_FILE: /run/secrets/webhook_url  # alerts by POST; Discord URLs get a chat message
      # WEBHOOK_ALLOWED_CIDRS: 100.82.0.0/16  # needed when the receiver is on the mesh
      # METRICS_TOKEN_FILE: /run/secrets/metrics_token  # enables /metrics for Prometheus
      # OIDC_ISSUER: https://auth.example.lan  # SSO; also set OIDC_CLIENT_ID, OIDC_CLIENT_SECRET_FILE, OIDC_REDIRECT_URI
      # OIDC_ADMIN_GROUPS: clamav-admins  # nobody without a listed group can sign in via SSO
      # LDAP_URL: ldaps://dc.example.lan  # directory sign-in; also LDAP_BIND_DN, LDAP_BIND_PASSWORD_FILE, LDAP_USER_BASE, LDAP_ADMIN_GROUPS
    ports:
      - "8080:8080"  # bind to the mesh IP in production, e.g. 100.82.x.y:8080:8080
    networks:
      - media
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data  # app state; owned by UID 10001
      - /data:/data:ro
      - /documents:/documents:ro
      - /games:/games:ro

networks:
  media:
    external: true
