name: rust
on:
  push:
    branches: [main]
    tags: ['v*']  # vX.Y.Z publishes a release; must match the Cargo.toml version
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Released migrations never change
        run: scripts/check-migrations.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: t }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: test, MYSQL_DATABASE: t }
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -ptest" --health-interval 5s --health-retries 30
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: test, MARIADB_DATABASE: t }
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 30
    env:
      TEST_DATABASE_URLS: postgres://postgres:test@127.0.0.1:5432/t,mysql://root:test@127.0.0.1:3306/t,mariadb://root:test@127.0.0.1:3307/t
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked -p palisade --test db

  ldap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Start OpenLDAP with TLS
        run: |
          docker run -d --name ldap --hostname localhost -p 13389:389 -p 13636:636 \
            -e LDAP_DOMAIN=lan.test -e LDAP_ADMIN_PASSWORD=adminpw -e LDAP_TLS_VERIFY_CLIENT=never \
            osixia/openldap:1.5.0
          for i in $(seq 60); do docker exec ldap ldapsearch -x -H ldap://localhost -D cn=admin,dc=lan,dc=test -w adminpw -b dc=lan,dc=test -s base >/dev/null 2>&1 && break; sleep 2; done
          docker cp crates/server/tests/fixtures/ldap-seed.ldif ldap:/tmp/seed.ldif
          docker exec ldap ldapadd -x -H ldap://localhost -D cn=admin,dc=lan,dc=test -w adminpw -f /tmp/seed.ldif
          docker exec ldap cat /container/service/:ssl-tools/assets/default-ca/default-ca.pem > "$RUNNER_TEMP/ldap-ca.pem"
      - run: cargo test --locked -p palisade --test ldap -- --nocapture
        env:
          TEST_LDAP_CA: ${{ runner.temp }}/ldap-ca.pem

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  image:
    needs: [check, migrations, db, ldap, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build for scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: palisade:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image once (a broken image never reaches a tag)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 18080:8080 palisade:scan
          for i in $(seq 30); do
            if docker exec smoke /app/palisade healthcheck >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              echo "image started and answers /healthz"; docker rm -f smoke >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "image did not become healthy" >&2
          docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}}' smoke >&2
          # Log lines only, with anything credential-like left out.
          docker logs smoke 2>&1 | grep -viE 'password|token|secret' | tail -n 40 >&2
          exit 1
      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "${GITHUB_REF_NAME#v}" = "$want" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want" >&2; exit 1; }
      - name: Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: palisade:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Trivy gate (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: palisade:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish the GitHub release (drives the dashboard's update notice)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run finds the release already there.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
