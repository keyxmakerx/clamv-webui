name: clamctl / test and cross-platform binaries
on:
  push:
    paths: ['cli/**', 'crates/**', 'Cargo.lock', 'scripts/test-clamctl-integration.py', '.github/workflows/clamctl.yml']
  pull_request:
    paths: ['cli/**', 'crates/**', 'Cargo.lock', 'scripts/test-clamctl-integration.py', '.github/workflows/clamctl.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o clamctl-test${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/clamctl
      - name: Executable smoke test
        shell: bash
        run: ./clamctl-test* --version
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go run ./tools/build.go
        working-directory: cli
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked --release -p clamv-webui
      - run: python3 scripts/test-clamctl-integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: clamctl-v2.1.0-all-platforms
          path: |
            cli/dist/
            cli/README.md
            cli/LICENSE
            cli/GO-LICENSE.txt
            cli/THIRD_PARTY_NOTICES.md
            cli/third_party/
            docs/MCP.md
            examples/mcp/
