# Palisade with everything on: clamd, CrowdSec, HTTPS, quarantine, metrics, canaries, plus alerts and host checks to fill in.
# Start: docker compose -f docker-compose.full.yml up -d (or save this file as docker-compose.yml), then open https://localhost:8080.
# First password, copied to a file you own without printing it: docker compose -f docker-compose.full.yml cp palisade:/app/data/bootstrap-admin-password ./admin-password
# Lines marked "host:" need something on the host first; uncomment them once it is there. Admin > Setup shows what is still missing.
services:
  palisade:
    image: ghcr.io/keyxmakerx/palisade:latest
    container_name: palisade
    restart: unless-stopped
    mem_limit: 512m  # caps memory if sign-ins or scans spike
    depends_on:
      secrets-init:
        condition: service_completed_successfully  # the generated passwords exist before Palisade reads them
      clamav:
        condition: service_started  # not service_healthy: Palisade starts at once and shows clamd as starting while signatures load
      crowdsec:
        condition: service_started  # the CrowdSec pages show it as down until its API answers
    environment:
      SCAN_ROOTS: /scan  # path scans, schedules and watched folders stay inside these folders
      TLS_SELF_SIGNED: "true"  # HTTPS with a certificate kept in the data volume; agents pin its fingerprint (Admin > Agents)
      # TLS_SELF_SIGNED_NAMES: nas.lan,192.168.1.10  # names and IPs you open Palisade at; changing it later means new agent fingerprints
      # PUBLIC_URL: https://nas.lan:8080  # the address you open; passkeys are tied to its host name and other host names are refused
      # ALLOWED_HOSTS: 192.168.1.10  # more host names accepted when PUBLIC_URL is set
      QUARANTINE_DIR: /app/data/quarantine  # infected files can be moved here; needs the read-write ./scan mount below
      # QUARANTINE_AUTO: "true"  # move every new detection without asking
      CROWDSEC_LAPI_URL: http://crowdsec:8080  # turns on the CrowdSec pages
      CROWDSEC_PASSWORD_FILE: /secrets/crowdsec_password  # generated by secrets-init; CrowdSec registers watcher "palisade" with it on start
      METRICS_TOKEN_FILE: /secrets/metrics_token  # turns on /metrics; give Prometheus this file as its bearer token
      CANARY_FILES: /canary/passwords.kdbx  # decoy; put a tempting file with this name in ./canary, and any access raises an alert
      # WEBHOOK_URL_FILE: /run/secrets/webhook_url  # alerts; also uncomment both "webhook_url" secret blocks below
      # WEBHOOK_ALLOWED_CIDRS: 192.168.1.0/24  # needed when the alert receiver is on your LAN
      # SCHEDULE_TZ: Europe/Berlin  # default time zone for schedules
      # OIDC_ISSUER: https://auth.example.lan  # SSO; also OIDC_CLIENT_ID, OIDC_CLIENT_SECRET_FILE, OIDC_REDIRECT_URI, OIDC_ADMIN_GROUPS
      # LDAP_URL: ldaps://dc.example.lan  # directory sign-in; also LDAP_BIND_DN, LDAP_BIND_PASSWORD_FILE, LDAP_USER_BASE, LDAP_ADMIN_GROUPS
    # secrets:
    #   - webhook_url  # appears as /run/secrets/webhook_url
    ports:
      - "8080:8080"  # HTTPS; use "127.0.0.1:8080:8080" to reach it from this machine only
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - palisade-data:/app/data  # database, keys, certificate and quarantine (back this up); upgrading from ./data? keep ./data:/app/data
      - palisade-secrets:/secrets:ro  # passwords made by secrets-init
      - ./scan:/scan  # read-write so quarantine can move files out; on the host: sudo chown -R 10001 scan
      - ./canary:/canary:ro  # decoy files; keep them outside scanned folders
      # - /var/log/aide:/var/log/aide:ro  # host: AIDE reports (install aide, run aide --check daily into /var/log/aide/aide.log)
      # - /var/log/rkhunter.log:/var/log/rkhunter.log:ro  # host: rkhunter report (install rkhunter)
      # - /var/log/falco:/var/log/falco:ro  # host: Falco JSON alerts (json_output and file_output to events.json)
      # - /var/log/audit:/var/log/audit:ro  # host: auditd log, so canary alerts name who touched the file
      # - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro  # host: managed AIDE/rkhunter and firewall, after host-setup (docs/CONFIGURATION.md)
      # - /var/lib/palisade/firewall:/var/lib/palisade/firewall  # host: firewall snapshots and plans, after host-setup
      # - /var/lib/palisade/timers:/var/lib/palisade/timers  # host: AIDE/rkhunter timer times, after host-setup

  clamav:
    image: clamav/clamav:latest  # first start loads signatures (a minute or more); Palisade shows clamd as unreachable until then
    container_name: clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 1024M  # matches Palisade's default 1 GB upload limit (CLAMD_MAX_STREAM_MB)
      CLAMD_CONF_MaxScanSize: 1024M  # keep at or above StreamMaxLength
      CLAMD_CONF_MaxFileSize: 1024M  # keep at or above StreamMaxLength
    volumes:
      - clamav-db:/var/lib/clamav  # signatures survive restarts
      - ./scan:/scan:ro  # clamd only reads; same paths as Palisade

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c", 'set -e; p=$$(cat /secrets/crowdsec_password); export AGENT_USERNAME=palisade AGENT_PASSWORD="$$p"; exec /bin/bash /docker_start.sh']  # registers watcher "palisade" with the generated password, then starts CrowdSec as usual
    environment:
      COLLECTIONS: crowdsecurity/linux  # what CrowdSec detects; add e.g. crowdsecurity/sshd crowdsecurity/nginx for logs you mount
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data  # alerts and decisions
      - crowdsec-config:/etc/crowdsec  # hub items and settings
      - palisade-secrets:/secrets:ro
      # - /var/log:/var/log:ro  # host: logs for CrowdSec to read (auth.log, syslog, nginx, ...)

  secrets-init:
    image: crowdsecurity/crowdsec:latest  # any image with a shell; this one is pulled anyway
    entrypoint: ["/bin/sh", "-c", "umask 077 && for s in crowdsec_password metrics_token; do [ -s /secrets/$$s ] || tr -dc A-Za-z0-9 </dev/urandom | head -c 40 >/secrets/$$s; done && chown -R 10001:10001 /secrets && chmod 700 /secrets"]  # makes each password once, readable only by Palisade's UID (and root)
    network_mode: none  # needs no network
    restart: "no"  # runs once per start and exits
    volumes:
      - palisade-secrets:/secrets

# secrets:
#   webhook_url:
#     file: ./secrets/webhook_url  # one line of comma-separated destinations; on the host: sudo chown 10001 secrets/webhook_url && sudo chmod 600 secrets/webhook_url

volumes:
  palisade-data:  # starts owned by the app's UID 10001, copied from the image
  clamav-db:
  crowdsec-db:
  crowdsec-config:
  palisade-secrets:  # generated passwords; kept across restarts
