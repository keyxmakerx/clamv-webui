# Agent: scans this host's folders with its own clamd and reports to a palisade server.
services:
  palisade-agent:
    image: ghcr.io/keyxmakerx/palisade:latest
    container_name: palisade-agent
    command: agent
    restart: unless-stopped
    mem_limit: 256m  # caps memory if sign-ins or scans spike
    environment:
      AGENT_SERVER_URL: https://100.82.0.5:8080  # the server as this host reaches it; http:// is refused
      AGENT_TOKEN_FILE: /run/secrets/agent_token  # token from Admin > Agents
      AGENT_SERVER_FINGERPRINT: AB:CD:EF:...  # server certificate SHA-256 from Admin > Agents; or AGENT_CA_FILE for a private CA
      # AGENT_ALLOW_PLAINTEXT: "true"  # accept http:// (token unencrypted); only on a private VPN or mesh
      # AGENT_QUEUE_DIR: /queue  # keep unsent results across agent restarts; mount a writable volume
      CLAMD_ENDPOINT: tcp://clamav:3310  # this host's clamd
      SCAN_ROOTS: /data  # folders this agent may scan; clamd must see the same paths
      # REALTIME_PATHS: /data/downloads  # scan files here as soon as they are written
      # CANARY_FILES: /srv/secrets/passwords.kdbx  # decoy; any access alerts (mount it read-only)
      # CANARY_DIRS: /srv/secrets  # folders where the server may write decoys; elsewhere it can only watch
      # AGENT_ALLOW: scan,canaries,checks  # what this host lets the server ask for; add firewall, baseline, timers, quarantine
      # QUARANTINE_DIR: /quarantine  # opt-in; needs a writable volume and read-write scan roots
      LOG_FORMAT: json  # one JSON object per line for log shippers
    secrets:
      - agent_token
    networks:
      - media  # the network this host's clamd is on
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /data:/data:ro
      # - ./queue:/queue  # for AGENT_QUEUE_DIR; chown 10001
      # - /var/log/aide:/var/log/aide:ro  # AIDE reports, read every 5 min
      # - /var/log/rkhunter.log:/var/log/rkhunter.log:ro  # rkhunter report
      # - /var/log/audit:/var/log/audit:ro  # lets canary alerts name who touched them
      # - /var/log/falco:/var/log/falco:ro  # Falco JSON alerts (json_output + file_output)
      # - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro  # managed AIDE/rkhunter and firewall (after host-setup)
      # - /var/lib/palisade/firewall:/var/lib/palisade/firewall  # firewall snapshots and plans (after host-setup)
      # - /var/lib/palisade/timers:/var/lib/palisade/timers  # AIDE/rkhunter timer times (after host-setup)

secrets:
  agent_token:
    file: ./agent_token  # token from Admin > Agents; chown 10001 and chmod 600

networks:
  media:
    external: true
