# Palisade with its own clamd; no preparation needed. Start: docker compose up -d, then open http://localhost:8080 and sign in as admin.
# First password, copied to a file you own without printing it: docker compose cp palisade:/app/data/bootstrap-admin-password ./admin-password
# Next: Admin > Setup lists what to turn on. docker-compose.full.yml has everything on; docker-compose.external-clamd.yml uses a clamd you already run.
services:
  palisade:
    image: ghcr.io/keyxmakerx/palisade:latest
    container_name: palisade
    restart: unless-stopped
    mem_limit: 512m  # caps memory if sign-ins or scans spike
    depends_on:
      clamav:
        condition: service_started  # not service_healthy: Palisade starts at once and shows clamd as starting while signatures load
    environment:
      SCAN_ROOTS: /scan  # path scans, schedules and watched folders stay inside these folders
    ports:
      - "8080:8080"  # use "127.0.0.1:8080:8080" to reach it from this machine only
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - palisade-data:/app/data  # database, keys and certificates (back this up); upgrading from a ./data folder? keep ./data:/app/data here
      - ./scan:/scan:ro  # put files to scan in ./scan; created on first start if missing

  clamav:
    image: clamav/clamav:latest  # first start loads signatures (a minute or more); Palisade shows clamd as unreachable until then
    container_name: clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 1024M  # matches Palisade's default 1 GB upload limit (CLAMD_MAX_STREAM_MB)
      CLAMD_CONF_MaxScanSize: 1024M  # keep at or above StreamMaxLength
      CLAMD_CONF_MaxFileSize: 1024M  # keep at or above StreamMaxLength
    volumes:
      - clamav-db:/var/lib/clamav  # signatures survive restarts
      - ./scan:/scan:ro  # clamd reads files at the same paths Palisade sees

volumes:
  palisade-data:  # starts owned by the app's UID 10001, copied from the image
  clamav-db:
