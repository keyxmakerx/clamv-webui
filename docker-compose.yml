# UI plus its own clamd. For a clamd you already run, use docker-compose.external-clamd.yml.
# Before the first start: mkdir -p data scan && sudo chown 10001:10001 data
services:
  clamv-webui:
    image: ghcr.io/keyxmakerx/clamv-webui:latest
    container_name: clamv-webui
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      CLAMD_ENDPOINT: tcp://clamav:3310  # the bundled clamd below
      CLAMD_HOST_ALLOWLIST: clamav  # admins can only add endpoints on these hosts
      SCAN_ROOTS: /scan  # path scans and watched folders stay inside these
      CLAMD_MAX_STREAM_MB: "1024"  # 1 GB uploads; the bundled clamd below is raised to match
      # QUARANTINE_DIR: /app/data/quarantine  # opt-in; needs read-write scan roots
      LOG_FORMAT: json  # one JSON object per line
      # TLS_SELF_SIGNED: "true"  # HTTPS; remote agents need it (Admin > Agents shows the fingerprint)
      # TLS_SELF_SIGNED_NAMES: 100.82.x.y  # names agents connect to; changing it means new agent fingerprints
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data  # app state; owned by UID 10001
      - ./scan:/scan:ro  # files to scan; clamd sees the same path

  clamav:
    image: clamav/clamav:latest  # first start downloads signatures; the UI shows it unreachable until then
    container_name: clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 1024M  # written into clamd.conf at start; matches CLAMD_MAX_STREAM_MB
      CLAMD_CONF_MaxScanSize: 1024M  # keep at or above StreamMaxLength
      CLAMD_CONF_MaxFileSize: 1024M  # keep at or above StreamMaxLength
    volumes:
      - clamav-db:/var/lib/clamav  # signatures survive restarts
      - ./scan:/scan:ro

volumes:
  clamav-db:
