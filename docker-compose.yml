# UI plus its own clamd. For a clamd you already run, use docker-compose.external-clamd.yml.
services:
  clamv-webui:
    image: ghcr.io/keyxmakerx/clamv-webui:latest
    container_name: clamv-webui
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      CLAMD_ENDPOINT: tcp://clamav:3310  # the bundled clamd below
      CLAMD_HOST_ALLOWLIST: clamav  # admins can only add endpoints on these hosts
      SCAN_ROOTS: /scan  # path scans and watched folders stay inside these
      LOG_FORMAT: json  # one JSON object per line
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data  # app state; owned by UID 10001
      - ./scan:/scan:ro  # files to scan; clamd sees the same path

  clamav:
    image: clamav/clamav:latest  # raise StreamMaxLength to 1024M in clamd.conf for 1 GB uploads
    container_name: clamav
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav  # signatures survive restarts
      - ./scan:/scan:ro

volumes:
  clamav-db:
